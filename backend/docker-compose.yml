services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitzeno
      POSTGRES_PASSWORD: fitzeno_dev_password
      POSTGRES_DB: fitzeno_dev
    ports:
      - '5432:5432'
    volumes:
      - fitzeno_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitzeno -d fitzeno_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fitzeno_postgres_data:
